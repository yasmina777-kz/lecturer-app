services:
  - type: web
    name: lecturer-krsl
    runtime: docker
    region: frankfurt
    plan: 1c-2g
    dockerfilePath: ./ml/krsl/Dockerfile
    dockerContext: ./ml/krsl
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: KRSL_SERVICE_TOKEN
        generateValue: true
