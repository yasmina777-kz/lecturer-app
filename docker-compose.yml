services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: lecturer
      POSTGRES_USER: lecturer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lecturer -d lecturer"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      Database__Provider: Postgres
      ConnectionStrings__Default: "Host=postgres;Database=lecturer;Username=lecturer;Password=${POSTGRES_PASSWORD}"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-}
      AI__Model: ${AI__Model:-gpt-4o-mini}
      AI__BaseUrl: ${AI__BaseUrl:-https://api.openai.com/v1/}
      AI__TranscriptionModel: ${AI__TranscriptionModel:-whisper-1}
      AI__InputUsdPerMillion: ${AI__InputUsdPerMillion:-}
      AI__CachedUsdPerMillion: ${AI__CachedUsdPerMillion:-}
      AI__OutputUsdPerMillion: ${AI__OutputUsdPerMillion:-}
      Cors__AllowedOrigins__0: http://localhost:5173
    volumes:
      - appdata:/app/App_Data
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
volumes:
  pgdata:
  appdata:
